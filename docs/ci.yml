name: RISMOS CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Type-Check, Test & Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://root:root@127.0.0.1:3306/rismos_test' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-at-least-32-chars-long-2026' }}
      NEXT_PUBLIC_APP_URL: http://localhost:4028
      APP_URL: http://localhost:4028

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-Check (App, Tests, Scripts)
        run: npm run type-check:all

      - name: ESLint Verification
        run: npm run lint

      - name: Run Core White-Label & Responsive Tests
        run: |
          npm run test:security
          npm run test:rismos
          npm run test:localization
          npm run test:responsive
          npm run test:unit

      - name: Production Next.js Build Gate
        run: npm run build
        env:
          NODE_ENV: production
